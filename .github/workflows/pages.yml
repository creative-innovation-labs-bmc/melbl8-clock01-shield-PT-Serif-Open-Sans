name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify repository-hosted p5.js
        shell: bash
        env:
          EXPECTED_SHA512: uaz5GpnQoE6t5echKlX8P52czvsIGgLPcvlzfvRubLZ1Hp8JemUDnbUiAahbVtPb+jUVrNETuXvAhDDF/N3M4w==
        run: |
          set -euo pipefail
          test "$(stat -c%s vendor/p5.min.js)" -gt 900000
          actual="$(openssl dgst -sha512 -binary vendor/p5.min.js | openssl base64 -A)"
          test "$actual" = "$EXPECTED_SHA512"
          grep -F 'vendor/p5.min.js?v=1.9.0' index.html
          ! grep -F 'cdnjs.cloudflare.com/ajax/libs/p5.js' index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live page uses local p5.js
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA512: uaz5GpnQoE6t5echKlX8P52czvsIGgLPcvlzfvRubLZ1Hp8JemUDnbUiAahbVtPb+jUVrNETuXvAhDDF/N3M4w==
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 8 --retry-delay 3 \
            "$PAGE_URL" -o /tmp/index.html
          grep -F 'vendor/p5.min.js?v=1.9.0' /tmp/index.html
          ! grep -F 'cdnjs.cloudflare.com/ajax/libs/p5.js' /tmp/index.html

          curl --fail --silent --show-error --location --retry 8 --retry-delay 3 \
            "${PAGE_URL%/}/vendor/p5.min.js" -o /tmp/p5.min.js
          test "$(stat -c%s /tmp/p5.min.js)" -gt 900000
          actual="$(openssl dgst -sha512 -binary /tmp/p5.min.js | openssl base64 -A)"
          test "$actual" = "$EXPECTED_SHA512"
